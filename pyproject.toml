[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowflake-sqlalchemy"
dynamic = ["version"]
description = "Snowflake SQLAlchemy Dialect"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
  { name = "Snowflake Inc.", email = "triage-snowpark-python-api-dl@snowflake.com" },
]
keywords = ["Snowflake", "analytics", "cloud", "database", "db", "warehouse"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Other Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: SQL",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  # Dual support for SQLAlchemy 2.0.44 through 2.1.x. 2.1 privatised
  # ORMSelectCompileState and dropped async_fallback; the dialect feature-detects
  # those APIs. Ceiling is <2.2 so later 2.1.x (2.1.1, …) resolve. Hatch env
  # ``default`` tests the latest line; ``sa20`` tests the 2.0 line.
  "SQLAlchemy>=2.0.44,<2.2",
  # Connector 5.x is the baseline: it provides the async driver. It requires
  # Python >=3.11, which sets this project's requires-python floor.
  "snowflake-connector-python>=5.1.0,<6.0",
]

[tool.hatch.version]
path = "src/snowflake/sqlalchemy/version.py"

[project.optional-dependencies]
# SQLAlchemy 2.1 no longer installs greenlet by default. Connector 5.x (the
# native aio driver) stays a base dependency; this extra only pulls
# SQLAlchemy[asyncio] so create_async_engine() has greenlet on both 2.0 and 2.1.
async = ["SQLAlchemy[asyncio]>=2.0.44,<2.2"]
development = [
  "alembic",
  "mypy>=1.0,<2.0",
  "pre-commit",
  "pytest",
  "setuptools",
  "pytest-cov",
  "pytest-timeout",
  "pytest-rerunfailures",
  "pytest-xdist",
  "pytest-asyncio>=0.24",
  "pytz",
  "numpy",
  "syrupy",
  "alembic",
]
pandas = ["snowflake-connector-python[pandas]"]

[project.entry-points."sqlalchemy.dialects"]
snowflake = "snowflake.sqlalchemy:dialect"
"snowflake.snowflake_async" = "snowflake.sqlalchemy._async.async_dialect:SnowflakeDialect_async"

[project.urls]
Changelog = "https://github.com/snowflakedb/snowflake-sqlalchemy/blob/main/DESCRIPTION.md"
Documentation = "https://docs.snowflake.com/en/user-guide/sqlalchemy.html"
Homepage = "https://www.snowflake.com/"
Issues = "https://github.com/snowflakedb/snowflake-sqlalchemy/issues"
Source = "https://github.com/snowflakedb/snowflake-sqlalchemy"

[tool.hatch.build.targets.sdist]
exclude = ["/.github"]

[tool.hatch.build.targets.wheel]
packages = ["src/snowflake"]

[tool.hatch.envs.default]
# Latest SQLAlchemy line (<2.2). The explicit floor, rather than the base
# dependency alone, makes hatch upgrade envs created on 2.0 instead of keeping
# them, and stops an index without a final 2.1 from silently resolving 2.0.
# ``sa20`` and ``testing`` inherit from this env via ``template``/matrix.
extra-dependencies = ["SQLAlchemy>=2.1.0,<2.2"]
features = ["development", "pandas", "async"]
python = "3.11"
installer = "uv"

[tool.hatch.envs.default.env-vars]
COVERAGE_FILE = "coverage.xml"

[tool.hatch.envs.default.scripts]
check = "pre-commit run --all-files"
test-dialect = "pytest -ra -vvv --tb=short --ignore=tests/sqlalchemy_test_suite tests/"
test-dialect-compatibility = "pytest -ra -vvv --tb=short tests/sqlalchemy_test_suite"
test-dialect-async-sync = "pytest -ra -vvv --tb=short tests_async/"
test-dialect-async = "SNOWFLAKE_ASYNC_TESTS=1 pytest -ra -vvv --tb=short tests_async/"
test-dialect-compatibility-async = "SNOWFLAKE_ASYNC_TESTS=1 pytest -ra -vvv --tb=short tests/sqlalchemy_test_suite tests_async/"
test-dialect-aws = "pytest -m \"aws\" -ra -vvv --tb=short --ignore=tests/sqlalchemy_test_suite tests/"
# Selections by marker; ``unit``/``integ`` are auto-applied by tests/conftest.py.
# ``-m`` replaces the addopts expression, so its exclusions are repeated here.
test-unit = "pytest -ra -vvv --tb=short -m \"unit and not feature_max_lob_size and not aws and not requires_external_volume\" --ignore=tests/sqlalchemy_test_suite tests/"
test-integration = "pytest -ra -vvv --tb=short -m \"integ and not feature_max_lob_size and not aws and not requires_external_volume\" --ignore=tests/sqlalchemy_test_suite tests/"
test-multicloud = "pytest -ra -vvv --tb=short -m \"multicloud and not feature_max_lob_size and not aws and not requires_external_volume\" --ignore=tests/sqlalchemy_test_suite tests/"
check-sa-version = 'python -c "import sqlalchemy; print(sqlalchemy.__version__)"'
gh-cache-sum = "python -VV | sha256sum | cut -d' ' -f1"
check-import = "python -c 'import snowflake.sqlalchemy; print(snowflake.sqlalchemy.__version__)'"
type-check = "mypy src/snowflake/sqlalchemy/"
# CI ops scripts (SLO metrics). Each supports --dry-run for local use.
ci-parse-junit = "python -m ci.scripts.parse_junit_to_csv {args}"
ci-test-summary = "python -m ci.scripts.upload_test_summary {args}"
ci-version-lag = "python -m ci.scripts.check_version_lag {args}"
ci-parse-cves = "python -m ci.scripts.parse_cves {args}"
ci-cve-tickets = "python -m ci.scripts.create_cve_tickets {args}"

# SQLAlchemy 2.0 line, for backward compatibility: same features, python and
# scripts as ``default``; only the SA pin differs. On 2.0, SQLAlchemy[asyncio]
# installs greenlet by default. Run on demand (``hatch run sa20:<script>``)
# and by the daily Jenkins RT-SQLAlchemy job on Python 3.11.
[tool.hatch.envs.sa20]
template = "default"
extra-dependencies = ["SQLAlchemy[asyncio]>=2.0.44,<2.1"]

# Multi-Python matrix for the daily Jenkins RT-SQLAlchemy jobs. Scripts inherit
# from ``default`` except test-compatibility, which combines both suites.
[[tool.hatch.envs.testing.matrix]]
python = ["3.11", "3.12", "3.13", "3.14"]
features = ["development", "pandas", "async"]

[tool.hatch.envs.testing.scripts]
test-dialect = "pytest -ra -vvv --tb=short --ignore=tests/sqlalchemy_test_suite tests/"
test-compatibility = "pytest -ra -vvv --tb=short tests/sqlalchemy_test_suite tests/"

# Coverage is collected per OS in the cloud-test matrix (ubuntu/macos/windows)
# and combined on a single ubuntu runner. `relative_files` makes each job record
# paths relative to this config instead of absolute runner paths, and
# [tool.coverage.paths] folds the per-OS/per-install variants back onto the local
# source tree so `coverage combine` + `coverage report` can resolve the source.
[tool.coverage.run]
relative_files = true

[tool.coverage.paths]
source = [
  "src/snowflake/sqlalchemy",
  "*/src/snowflake/sqlalchemy",
  "*\\src\\snowflake\\sqlalchemy",
  "*/snowflake/sqlalchemy",
  "*\\snowflake\\sqlalchemy",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-select = ["B", "I"] # flake8-bugbear + isort rules

[tool.ruff.lint.per-file-ignores]
# F821: names come from `from sqlalchemy.testing.suite import *` which ruff cannot resolve
"tests/sqlalchemy_test_suite/test_suite.py" = ["F821"]

[tool.pytest.ini_options]
addopts = "-m 'not feature_max_lob_size and not aws and not requires_external_volume'"
# Put the repo root on sys.path so tests_async/ (which has no __init__.py) can
# import the shared tests.conftest helpers, matching how tests/ resolves.
pythonpath = ["."]
markers = [
  # Optional dependency groups markers
  "lambda: AWS lambda tests",
  "pandas: tests for pandas integration",
  "sso: tests for sso optional dependency integration",
  # Cloud provider markers
  "aws: tests for Amazon Cloud storage",
  "azure: tests for Azure Cloud storage",
  "gcp: tests for Google Cloud storage",
  # Test type markers
  "integ: needs a live Snowflake account; auto-applied by tests/conftest.py from the fixtures used (mark explicitly when connecting in the test body)",
  "unit: runs without a Snowflake connection; auto-applied by tests/conftest.py to every test not marked integ",
  "multicloud: exercises cloud storage (PUT/GET, COPY INTO); run on every cloud provider",
  "skipolddriver: skip for old driver tests",
  # Other markers
  "timeout: tests that need a timeout time",
  "internal: tests that could but should only run on our internal CI",
  "requires_external_volume: tests that needs a external volume to be executed",
  "external: tests that could but should only run on our external CI",
  "feature_max_lob_size: tests that could but should only run on our external CI",
  "mypy: typing tests",
  # sqlalchemy.testing markers (auto-applied from __backend__/__sparse_backend__ on test classes)
  "backend: sqlalchemy.testing — class runs against the configured backend(s)",
  "sparse_backend: sqlalchemy.testing — class runs against a sparse subset of backends",
  "sparse_driver_backend: sqlalchemy.testing — class runs against a sparse subset of drivers",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
# Ignore stubs that are missing for snowflake-connector-python
ignore_missing_imports = true
# Check function bodies even when unannotated
check_untyped_defs = true
# Surface stale # type: ignore comments as annotations are added
warn_unused_ignores = true
